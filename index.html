<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Infinite Minesweeper · Auto Explorer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="stylesheet" href="/src/css/stylesheet.css" />
  </head>
  <body>
    <header class="brand-bar">
      <button
        class="menu-trigger"
        onclick="toggleMenu()"
        aria-label="Open menu"
      >
        ☰
      </button>
      <span class="brand">Infinite Minesweeper</span
      ><span class="brand-divider"></span
      ><span class="score-label">Score <b id="score">0</b></span>
      <div id="menu" style="display: none">
        <button onclick="restart()">New game</button>
        <button onclick="toggleFullscreen()">Fullscreen</button>
        <a
          href="https://github.com/Pluze/infinite-minesweeper"
          target="_blank"
          rel="noreferrer"
          >Source code ↗</a
        >
      </div>
    </header>
    <button id="mobile-controls" type="button" aria-expanded="false" aria-controls="auto-panel">Controls</button>
    <aside id="auto-panel" aria-label="Auto-play controls">
      <button
        id="auto-toggle"
        type="button"
        role="switch"
        aria-checked="false"
        aria-label="Auto-play"
        aria-keyshortcuts="Space"
      >
        <span id="playback-label">Paused</span><kbd>Space</kbd
        ><span class="toggle-track" aria-hidden="true"></span>
      </button>
      <div class="speed-row">
        <label for="auto-speed">Click speed</label
        ><span><output id="speed-value">4</output><small> / s</small></span>
      </div>
      <input id="auto-speed" type="range" min="0" max="16" step="1" value="2" />
      <span id="actual-rate">Actual 0 /s</span>
      <div class="scale-labels">
        <span>1</span><span>256</span><span>65,536</span>
      </div>
      <div class="divider"></div>
      <label class="switch-row"
        ><span>Probability overlay <kbd>F</kbd></span
        ><input id="show-probability" type="checkbox" role="switch" checked
      /></label>
      <label class="switch-row auxiliary-switch"
        ><span>Auto-pan</span
        ><input id="auto-center" type="checkbox" role="switch" checked
      /></label>
      <label
        class="switch-row auxiliary-switch"
        title="Pause before guessing, after all known safe moves are exhausted"
        ><span>Pause before guessing</span
        ><input id="run-to-guess" type="checkbox" role="switch"
      /></label>
      <span id="overlay-hint" class="sr-only"
        >Hold F to temporarily invert visibility</span
      >
      <span id="auto-status" class="sr-only" role="status">Paused</span>
    </aside>
    <section
      id="score-plot"
      aria-label="Score and detonated mine ratio history"
    >
      <div class="plot-heading">
        <span>Score ÷ opened cells</span
        ><span class="plot-summary">0 clicks</span>
      </div>
      <div class="plot-legend">
        <span>Score / opened</span
        ><span class="mine-ratio-legend">Detonated / known mines</span>
      </div>
      <div class="plot-ranges" role="group" aria-label="History range">
        <button type="button" data-window="0" aria-pressed="true">All</button>
        <button type="button" data-window="100000" aria-pressed="false">
          100k
        </button>
        <button type="button" data-window="10000" aria-pressed="false">
          10k
        </button>
        <button type="button" data-window="1000" aria-pressed="false">
          1k
        </button>
      </div>
      <svg
        viewBox="0 0 320 180"
        role="img"
        aria-label="Score versus clicks"
      ></svg>
      <span class="plot-tooltip" hidden></span>
    </section>
    <section id="density-plot" aria-label="Mine density history">
      <div class="plot-heading">
        <span
          title="(Revealed mines + flags) / (opened cells + flagged cells), without double counting"
          >Mine density / clicks</span
        ><span class="plot-summary">0 clicks</span>
      </div>
      <div class="plot-ranges" role="group" aria-label="History range">
        <button type="button" data-window="0" aria-pressed="true">All</button>
        <button type="button" data-window="100000" aria-pressed="false">
          100k
        </button>
        <button type="button" data-window="10000" aria-pressed="false">
          10k
        </button>
        <button type="button" data-window="1000" aria-pressed="false">
          1k
        </button>
      </div>
      <svg
        viewBox="0 0 320 180"
        role="img"
        aria-label="Mine density versus clicks"
      ></svg>
      <span class="plot-tooltip" hidden></span>
    </section>
    <nav id="mobile-charts" aria-label="Charts">
      <button type="button" data-mobile-plot="score" aria-controls="score-plot" aria-expanded="false">Score chart</button>
      <button type="button" data-mobile-plot="density" aria-controls="density-plot" aria-expanded="false">Mine density</button>
    </nav>
    <script src="./src/index.ts" async type="module"></script>
  </body>
</html>
